# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Lean formalization of the Alpöge-Fable Jacobian counterexample"
  description: >-
    An independent Lean 4 and Mathlib formalization of the explicit
    three-dimensional polynomial map announced by Levent Alpöge in 2026.
    The project proves that its formal Jacobian determinant is the nonzero
    constant -2, verifies an explicit three-point fibre over the complex
    numbers, and derives the failure of injectivity required to refute the
    dimension-three Jacobian conjecture. The source formulas and proof scope
    are recorded explicitly; no claim is made about the still-open
    two-dimensional case.
  authors:
    - "Arthur Freitas Ramos"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.AG", "math.LO"]
  msc2020: ["14R15", "03B35"]

sources:
  - title: "An explicit counterexample to the Jacobian conjecture"
    authors:
      - "Levent Alpöge"
    contributors:
      - name: "Akhil Mathew"
        role: "problem proposer credited in the announcement"
      - name: "Claude Fable"
        role: "AI collaborator credited in the announcement"
    id: "https://x.com/__alpoge__/status/2079028340955197566"
    type: "web post"
    location: "https://x.com/__alpoge__/status/2079028340955197566"
    relationship: "formalizes"
    note: "The Lean development formalizes the displayed map, its constant Jacobian determinant, and its explicit collision; it does not claim to formalize the discovery process or geometric explanations."

related_formalizations:
  - id: "https://github.com/deancureton/jacobian/tree/0d4a9212d874226ad81ce5a926becddfa94e6a88"
    relationship: "independent"
    note: "A public Lean formalization of the same map was audited as related work. This repository re-derives the declarations and does not import its code."
  - id: "https://isa-afp.org/entries/Jacobian_Counterexample.html"
    relationship: "independent"
    note: "An Isabelle/HOL formalization of the same explicit map provides a separate proof-assistant formalization and broader identity-padding results."

status:
  scope: >-
    The formalization defines multivariate-polynomial Jacobians and evaluation,
    encodes the announced map, proves the determinant identity over every
    field, and proves the displayed three-point collision and the resulting
    noninjectivity over the complex numbers. It does not formalize a general
    theory of polynomial automorphisms, the source's geometric explanation,
    or the dimension-two Jacobian conjecture.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "JacobianCounterexample.not_jacobian_conjecture_complex"

automation:
  methods:
    - method: "agent"
      models: ["GPT-5"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Proof engineering with simp, norm_num, field_simp, linear arithmetic, and ring; exact source and repository audits were performed before submission preparation."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local macOS workstation"
      prompting_notes: "Re-derive and verify the published polynomial map in Lean, preserving exact attribution and the distinction between determinant and noninjectivity."
  spend_usd: "subscription-based"
  notes: "The formalization was developed with agent assistance and is intended for maintainer review; the final source is checked by Lean rather than relying on external computer algebra."

fidelity:
  divergences: "The source announcement presents the complex three-dimensional map informally. The Lean definitions are polymorphic over fields where possible, while the advertised conjecture-negation theorem specializes to ℂ. The formalization proves the displayed collision rather than a complete description of the fibre and does not formalize later geometric or dynamical claims."

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "The map, determinant identity, collision, and final implication were checked in Lean 4 with pinned Mathlib. The public source and a separate Lean formalization were audited for attribution and scope; no external peer review is claimed."

alignment:
  namespace: "JacobianCounterexample"
  statements:
    - source: "Displayed map and determinant calculation"
      lean: "JacobianCounterexample.jacobianDet_F"
      module: "JacobianConjecture.Proof"
      status: "proved"
      note: "The formal Jacobian determinant is identically the nonzero constant -2."
    - source: "Displayed three-point fibre"
      lean: "JacobianCounterexample.explicit_three_point_fibre"
      module: "JacobianConjecture.Proof"
      status: "proved"
      note: "All three exact rational points map to (-1/4, 0, 0) over ℂ."
    - source: "Dimension-three consequence"
      lean: "JacobianCounterexample.not_jacobian_conjecture_complex"
      module: "JacobianConjecture.Proof"
      status: "proved"
      note: "A nonzero constant formal Jacobian determinant does not force injectivity in this dimension."

acknowledgements: "Mathlib and the Lean community; Levent Alpöge, Akhil Mathew, and Claude Fable for the announced construction and its credited origins; Dean Cureton for the related public Lean formalization; and the Isabelle/HOL formalization recorded at the Archive of Formal Proofs."
